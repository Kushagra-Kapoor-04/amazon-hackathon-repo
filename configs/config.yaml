
# ============================================================
# Business Entity Resolution — Pipeline Config
# ============================================================

paths:
  train_source1: "data/raw/train/train_source1.tsv"
  train_source2: "data/raw/train/train_source2.tsv"
  train_source3: "data/raw/train/train_source3.tsv"
  train_ground_truth: "data/raw/train/train_ground_truth.tsv"

  test_source1: "data/raw/test/test_source1.tsv"
  test_source2: "data/raw/test/test_source2.tsv"
  test_source3: "data/raw/test/test_source3.tsv"

  processed_dir: "data/processed"
  output_dir: "output"

  candidate_pairs_out: "output/candidate_pairs.tsv"
  matching_results_out: "output/matching_results.tsv"

  val_split_dir: "data/processed"
  val_predictions_out: "output/val_predictions.tsv"

# ------------------------------------------------------------
# Validation split (held out from TRAIN only, never touches test)
# ------------------------------------------------------------
validation:
  val_fraction: 0.2          # fraction of Source-1 train entities held out
  random_seed: 42
  stratify_on_singleton: true # keep singleton/multi-match ratio similar in val

# ------------------------------------------------------------
# Blocking / candidate generation
# ------------------------------------------------------------
blocking:
  strategy: "naive"           # "naive" | "tfidf_lsh" | "phonetic" | "union"
  top_k_per_entity: 30        # cap candidates per Source 1 entity
  ngram_range: [2, 3]         # char n-gram range for TF-IDF blocking
  min_name_similarity: 0.3    # loose pre-filter before TF-IDF/LSH scoring
  use_country_filter: true    # only block within same country when known
  unknown_country_fallback: true  # if country unseen (e.g. France), don't filter by it — just skip country filter for that record
  max_doc_frequency: 500      # skip any blocking token appearing in more than this many records (prevents O(n^2) blowup from common words)

# ------------------------------------------------------------
# Feature engineering
# ------------------------------------------------------------
features:
  name_features:
    - jaccard_token
    - levenshtein_ratio
    - jaro_winkler
    - token_sort_ratio
    - tfidf_cosine
    - exact_normalized_match
    - suffix_match_flag
  address_features:
    - token_overlap
    - levenshtein_ratio
    - pin_zip_exact_match
    - numeric_component_match
    - state_city_match_flag
  meta_features:
    - country_match_flag
    - name_length_diff
    - address_length_diff
    - missing_field_flags

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  type: "lightgbm"            # "lightgbm" | "xgboost" | "logistic_regression"
  license: "MIT"               # must be MIT or Apache-2.0 per competition rules
  max_params: 8000000000       # 8B ceiling — GBMs are nowhere near this, informational only
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    class_weight: "balanced"   # candidates are heavily imbalanced (few true matches per S1)
  negative_sampling_ratio: 5   # negatives : positives when building training pairs

# ------------------------------------------------------------
# Decision / thresholding
# ------------------------------------------------------------
decision:
  # F0.5 punishes false merges ~2x harder than misses.
  # Default threshold is intentionally conservative — "when unsure, do not merge."
  score_threshold: 0.65
  tune_threshold_on_validation: true
  threshold_search_range: [0.5, 0.95]
  threshold_search_step: 0.01
  abstain_if_top_score_below: 0.5   # if best candidate score for an S1 entity is below this, predict empty (singleton)

# ------------------------------------------------------------
# Misc
# ------------------------------------------------------------
misc:
  random_seed: 42
  n_jobs: -1
  verbose: true
